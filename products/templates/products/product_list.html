<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .card { 
            border: 1px solid #ccc; 
            padding: 15px; 
            margin: 10px; 
            border-radius: 8px; 
            background: white;
        }
        h1 { color: #333; }
    </style>
</head>
<body>
    <h1>🛍️ My Products</h1>
    <a href="/admin/products/product/add/">+ Add New Product in Admin</a>
    <hr>
    
    {% for product in products %}
        <div class="card">
            <h3>{{ product.name }}</h3>
            <p>Price: ₹{{ product.price }}</p>
            <p>{{ product.description }}</p> 
        </div>
    {% empty %}
        <p>No products yet. Go to admin to add!</p>
    {% endfor %}
</body>
</html>
